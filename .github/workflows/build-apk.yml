# Builds the release APK in the cloud: no game files needed (the app recompiles the
# game code on the device, -PwwhdDeviceRecomp). Run it from the Actions tab (Run
# workflow) or push to one of the branches below; the APK lands under Artifacts.
#
# Signing: without a release key the APK is signed with a fresh debug key on every
# run (fine for personal use, but it can't update an APK signed with another key —
# uninstall the old one first). For a stable key, add these repository secrets and
# the workflow signs with them: ANDROID_KEYSTORE_BASE64 (base64 of your .jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (android/app/build.gradle default is 1.14)'
        default: '1.14'
      versionCode:
        description: 'Version code (raise with every APK you share)'
        default: '14'
  push:
    branches: [main, master, port-0.2.8, 'arena/*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.versionName || '1.14' }}
      VERSION_CODE: ${{ inputs.versionCode || '14' }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the action's default package list still contains the long-removed 'tools'
          # package, which fails the install; platform-tools is all it needs to set up
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Host build tools (LLVM script, glslang)
        run: sudo apt-get update && sudo apt-get install -y ninja-build bison flex

      - name: LLVM install cache
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: build/llvm/install
          key: llvm-install-20.1.8-ndk27.2.12479018-${{ hashFiles('tools/android/build-llvm.sh') }}

      - name: Build LLVM for Android
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/android/build-llvm.sh

      - name: Save LLVM install cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/llvm/install
          key: llvm-install-20.1.8-ndk27.2.12479018-${{ hashFiles('tools/android/build-llvm.sh') }}

      - name: Configure signing key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/ci-release.keystore
            cat > android/keystore.properties <<EOF
storeFile=ci-release.keystore
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
keyPassword=$ANDROID_KEY_PASSWORD
EOF
          else
            echo "Generating signing key for release APK..."
            keytool -genkeypair -v -keystore android/app/ci-release.jks -alias wwhd -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass wwhdandroid -keypass wwhdandroid -dname "CN=WWHD, OU=Android, O=WWhd, L=Tripoli, S=Tripoli, C=LY"
            cat > android/keystore.properties <<EOF
storeFile=ci-release.jks
storePassword=wwhdandroid
keyAlias=wwhd
keyPassword=wwhdandroid
EOF
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK (no game code in it)
        working-directory: android
        run: |
          ./gradlew assembleRelease -PwwhdDeviceRecomp -PwwhdAllowDebugKey -PwwhdVersionName="$VERSION_NAME" -PwwhdVersionCode="$VERSION_CODE" --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || {
            echo "## ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 300 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Locate APK
        if: always()
        run: |
          find android -name "*.apk" -ls || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: /tmp/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wwhd-${{ env.VERSION_NAME }}-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: Upload native library (crash symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: wwhd-${{ env.VERSION_NAME }}-libwwhd.so
          path: android/app/build/intermediates/cxx/Release/*/obj/arm64-v8a/libwwhd.so
          if-no-files-found: warn

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_file=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$apk_file" ] && [ -f "$apk_file" ]; then
            echo "Publishing $apk_file to release v1.14..."
            gh release upload v1.14 "$apk_file#WindWakerHD-Android-Plus-v1.14.apk" --clobber || \
            gh release create v1.14 "$apk_file#WindWakerHD-Android-Plus-v1.14.apk" --title "v1.14 Android + Arabic" --notes-file RELEASE_NOTES.md --target "${{ github.ref_name }}"
          else
            echo "::error::No APK found in android/app/build/outputs/apk"
            exit 1
          fi
